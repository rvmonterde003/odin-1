<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin-2 · chase mock</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8e8e8;
      --mut: #8a8f98;
      --ok: #38c172;
      --warn: #f5a623;
      --line: #232a36;
      --card: #141922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem 2rem;
    }

    header { margin-bottom: 1.25rem; }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .sub {
      color: var(--mut);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .stream-wrap { margin-bottom: 1.25rem; }

    .frame {
      display: block;
      width: 320px;
      height: 320px;
      background: #1a1a1a;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      color: var(--mut);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      padding: 0.45rem 0.55rem;
      font-size: 0.875rem;
      font-variant-numeric: tabular-nums;
    }

    .connect-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1.25rem;
    }

    .connect-row .field { flex: 1 1 220px; }

    button {
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
    }

    section h2 {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.65rem;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .pill {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ok);
      border: 1px solid var(--ok);
      background: rgba(56, 193, 114, 0.12);
    }

    .meta {
      color: var(--mut);
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
    }

    .keys {
      color: var(--mut);
      font-size: 0.8125rem;
      margin-top: 0.75rem;
    }

    .mock-tag {
      color: var(--warn);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Odin-2 · chase</h1>
      <p class="sub">320×320 AprilTag · desktop only · <span class="mock-tag">mock, not live</span></p>
    </header>

    <div class="connect-row card" style="padding: 1rem;">
      <div class="field">
        <label for="pi_host">Pi host</label>
        <input type="text" id="pi_host" value="192.168.4.1" readonly>
      </div>
      <button type="button">Connect</button>
    </div>

    <section style="margin-bottom: 1rem;">
      <h2>Bias (µs)</h2>
      <div class="controls card" style="padding: 1rem;">
        <div class="field"><label>Roll</label><input type="number" value="1500" readonly></div>
        <div class="field"><label>Pitch</label><input type="number" value="1500" readonly></div>
        <div class="field"><label>Yaw</label><input type="number" value="1500" readonly></div>
        <div class="field"><label>Thrust</label><input type="number" value="1350" readonly></div>
      </div>
    </section>

    <section style="margin-bottom: 1rem;">
      <h2>Hover</h2>
      <div class="controls card" style="padding: 1rem;">
        <div class="field"><label>Hover thrust</label><input type="number" value="1350" readonly></div>
        <div class="field"><label>Hover slew</label><input type="number" value="2500" readonly></div>
        <div class="field"><label>Land thrust</label><input type="number" value="1100" readonly></div>
        <div class="field"><label>Land slew</label><input type="number" value="2500" readonly></div>
        <div class="field"><label>Action thrust</label><input type="number" value="20" readonly></div>
        <div class="field"><label>Action slew</label><input type="number" value="250" readonly></div>
      </div>
    </section>

    <section style="margin-bottom: 1rem;">
      <h2>Chase</h2>
      <div class="controls card" style="padding: 1rem;">
        <div class="field"><label>Yaw max</label><input type="number" value="80" readonly></div>
        <div class="field"><label>Yaw slew</label><input type="number" value="400" readonly></div>
        <div class="field"><label>Roll max</label><input type="number" value="30" readonly></div>
        <div class="field"><label>Roll slew</label><input type="number" value="200" readonly></div>
        <div class="field"><label>Pitch min</label><input type="number" value="0" readonly></div>
        <div class="field"><label>Pitch max</label><input type="number" value="120" readonly></div>
        <div class="field"><label>Pitch slew</label><input type="number" value="300" readonly></div>
        <div class="field"><label>Thrust target</label><input type="number" value="40" readonly></div>
        <div class="field"><label>Thrust slew</label><input type="number" value="250" readonly></div>
      </div>
    </section>

    <div class="card stream-wrap">
      <svg class="frame" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mock camera, tag right of center">
        <rect width="320" height="320" fill="#2a2a2a"/>
        <g stroke="#3a3a3a" stroke-width="1">
          <path d="M40 0 V320 M80 0 V320 M120 0 V320 M160 0 V320 M200 0 V320 M240 0 V320 M280 0 V320"/>
          <path d="M0 40 H320 M0 80 H320 M0 120 H320 M0 160 H320 M0 200 H320 M0 240 H320 M0 280 H320"/>
        </g>
        <line x1="160" y1="148" x2="160" y2="172" stroke="#666" stroke-width="1"/>
        <line x1="148" y1="160" x2="172" y2="160" stroke="#666" stroke-width="1"/>
        <g transform="translate(188,118)">
          <rect x="0" y="0" width="48" height="48" fill="#f4f4f4"/>
          <rect x="6" y="6" width="12" height="12" fill="#111"/>
          <rect x="30" y="6" width="12" height="12" fill="#111"/>
          <rect x="6" y="30" width="12" height="12" fill="#111"/>
          <rect x="22" y="18" width="8" height="8" fill="#111"/>
          <rect x="18" y="30" width="8" height="6" fill="#111"/>
          <rect x="30" y="28" width="10" height="10" fill="#111"/>
        </g>
        <rect x="184" y="114" width="56" height="56" fill="none" stroke="#38c172" stroke-width="2"/>
        <text x="12" y="22" fill="#8a8f98" font-family="system-ui, sans-serif" font-size="11">320×320 · id 0</text>
      </svg>
    </div>

    <div class="status-row">
      <span class="pill">Connected</span>
      <span class="meta">mode FOLLOW · arm 1 · agl 840 mm · tag 1 · cx 212 · cy 142</span>
    </div>

    <p class="keys">H hover · 1 follow · 2 hold · L land · Esc disarm</p>
  </div>
</body>
</html>
